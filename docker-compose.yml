version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://priceapp:${POSTGRES_PASSWORD}@postgres:5432/pricedb
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "3001:3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: priceapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pricedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priceapp -d pricedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Run migrations on startup
  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://priceapp:${POSTGRES_PASSWORD}@postgres:5432/pricedb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
