# nginx config for prices.wetpaws.dev
# Drop this into /etc/nginx/sites-available/prices.wetpaws.dev
# then: ln -s /etc/nginx/sites-available/prices.wetpaws.dev /etc/nginx/sites-enabled/
# and: certbot --nginx -d prices.wetpaws.dev

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name prices.wetpaws.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — certbot will fill in the ssl_certificate lines
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prices.wetpaws.dev;

    # SSL managed by certbot
    ssl_certificate     /etc/letsencrypt/live/prices.wetpaws.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prices.wetpaws.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Increase upload size for receipt images
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache Next.js static assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
