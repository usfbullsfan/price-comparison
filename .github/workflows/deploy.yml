name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Prepare release
        run: |
          # Static assets must live inside the standalone tree
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Prisma schema + migrations needed for migrate deploy
          cp -r prisma .next/standalone/prisma

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Open IAP tunnel
        run: |
          gcloud compute start-iap-tunnel "${{ secrets.GCP_INSTANCE }}" 22 \
            --local-host-port=localhost:2222 \
            --project="${{ secrets.GCP_PROJECT }}" \
            --zone="${{ secrets.GCP_ZONE }}" &
          # Wait until the tunnel port is ready (up to 30s)
          for i in $(seq 1 30); do
            nc -z localhost 2222 && break
            sleep 1
          done

      - name: Rsync to server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --timeout=60 \
            -e "ssh -i ~/.ssh/deploy_key -p 2222 -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3" \
            .next/standalone/ \
            ${{ secrets.GCP_USER }}@localhost:/opt/price-comparison/

      - name: Migrate & restart
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p 2222 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o BatchMode=yes \
            ${{ secrets.GCP_USER }}@localhost 'bash -ls' << 'EOF'
          set -euo pipefail
          cd /opt/price-comparison
          # Install globally so binaries match this server's platform;
          # npm skips the download on subsequent deploys if version already matches.
          npm install -g --no-fund --no-audit prisma@5 2>&1 | tail -1
          prisma migrate deploy
          pm2 reload price-comparison --update-env 2>/dev/null \
            || pm2 start server.js --name price-comparison
          EOF
