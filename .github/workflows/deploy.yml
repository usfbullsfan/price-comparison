name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Prepare release
        run: |
          # Static assets must live inside the standalone tree
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Prisma schema + migrations needed for migrate deploy
          cp -r prisma .next/standalone/prisma

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config

      - name: Rsync to server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }}:/opt/price-comparison/

      - name: Migrate & restart
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o BatchMode=yes \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} 'bash -ls' << 'EOF'
          set -euo pipefail
          cd /opt/price-comparison
          # Install globally so binaries match this server's platform;
          # npm skips the download on subsequent deploys if version already matches.
          npm install -g --no-fund --no-audit prisma@5 2>&1 | tail -1
          prisma migrate deploy
          pm2 reload price-comparison --update-env 2>/dev/null \
            || pm2 start server.js --name price-comparison
          EOF
