name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BUILD_SHA: ${{ github.sha }}

      - name: Prepare release
        run: |
          # Static assets must live inside the standalone tree
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Prisma schema + migrations needed for migrate deploy
          cp -r prisma .next/standalone/prisma
          # Bundle prisma CLI so the server doesn't need to download it
          npm install --prefix .next/standalone --no-save --no-fund --no-audit prisma@5

      - name: Trim standalone size
        run: |
          cd .next/standalone
          # Remove Prisma engines for platforms we don't deploy to (keep linux-musl)
          find node_modules/.prisma -name '*.node' ! -name '*linux*' -delete 2>/dev/null || true
          find node_modules/@prisma/engines -name '*.node' ! -name '*linux*' -delete 2>/dev/null || true
          # Remove tesseract.js training data we don't use (keep only English)
          find node_modules -path '*/tesseract.js-core/tesseract-core*' -name '*.wasm' | while read f; do
            # Keep only one WASM variant (the default)
            case "$f" in *-simd*) rm -f "$f";; esac
          done
          # Remove unnecessary files from node_modules
          find node_modules \( -name '*.md' -o -name '*.map' -o -name 'LICENSE*' -o -name 'CHANGELOG*' -o -name '*.d.ts' \) -delete 2>/dev/null || true
          echo "Standalone size: $(du -sh . | cut -f1)"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config

      - name: Rsync to server
        timeout-minutes: 15
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --partial \
            --timeout=120 \
            -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3" \
            .next/standalone/ \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }}:/opt/price-comparison/

      - name: Deploy nginx config
        run: |
          rsync -az --timeout=60 \
            -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3" \
            nginx/nginx.conf \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }}:/opt/price-comparison/nginx.conf
          ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o BatchMode=yes \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} \
            'sudo cp /opt/price-comparison/nginx.conf /etc/nginx/sites-available/prices-wetpaws-dev && sudo nginx -t && sudo systemctl reload nginx'

      - name: Migrate & restart
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Write .env locally and pipe to remote so the password is never
          # interpreted by any remote shell (handles $, #, and other metacharacters)
          printf 'DATABASE_URL="%s"\nPORT=3002\n' "${DATABASE_URL}" | \
            ssh -i ~/.ssh/deploy_key \
              -o ServerAliveInterval=30 \
              -o BatchMode=yes \
              ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} \
              'cat > /opt/price-comparison/.env'
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o BatchMode=yes \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} 'bash -ls' << 'EOF'
          set -euo pipefail
          cd /opt/price-comparison
          ./node_modules/.bin/prisma migrate deploy
          pm2 delete price-comparison 2>/dev/null || true
          set -a && . ./.env && set +a
          pm2 start server.js --name price-comparison
          pm2 save
          sleep 3
          echo "--- pm2 status ---"
          pm2 jlist | python3 -c "import sys,json; procs=json.load(sys.stdin); [print(f\"  name={p['name']} status={p['pm2_env']['status']} cwd={p['pm2_env'].get('pm_cwd','?')} pid={p['pid']} uptime={p['pm2_env'].get('pm_uptime','?')}\") for p in procs]" || pm2 list
          echo "--- pm2 logs ---"
          pm2 logs price-comparison --lines 30 --nostream || true
          echo "--- verifying /api/health ---"
          curl -sf http://127.0.0.1:3002/api/health || echo "WARN: health check failed"
          EOF
