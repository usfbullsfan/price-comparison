name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Prepare release
        run: |
          # Static assets must live inside the standalone tree
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Prisma schema + migrations needed for migrate deploy
          cp -r prisma .next/standalone/prisma
          # Prisma CLI (dev dep, not included in standalone node_modules)
          cp -r node_modules/prisma .next/standalone/node_modules/prisma
          cp node_modules/.bin/prisma .next/standalone/node_modules/.bin/prisma

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/price-comparison/

      - name: Migrate & restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -euo pipefail
            cd /opt/price-comparison
            node_modules/.bin/prisma migrate deploy
            pm2 reload price-comparison --update-env 2>/dev/null \
              || pm2 start server.js --name price-comparison
          EOF
